services:

  server:
    build: ./space-service
    container_name: space-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080

  scheduler:
    build: ./scheduler-service
    container_name: scheduler-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SERVER_URL=http://server:8080/api