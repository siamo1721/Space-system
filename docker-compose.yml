services:

  postgres:
    image: postgres:15-alpine
    container_name: space-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: space_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - space-net

  kafka:
    image: apache/kafka:3.9.2
    container_name: space-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - space-net

  server:
    build: ./space-service
    container_name: space-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - GRPC_TELEMETRY_HOST=telemetry
      - GRPC_TELEMETRY_PORT=9091
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/space_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres
      - telemetry
      - kafka
    networks:
      - space-net

  scheduler:
    build: ./mission-service
    container_name: scheduler-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SERVER_URL=http://server:8080/api
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - server
      - kafka
    networks:
      - space-net

  telemetry:
    build: ./telemetry-service
    container_name: telemetry-service
    ports:
      - "9091:9091"
    environment:
      - GRPC_SERVER_PORT=9091
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - space-net

networks:
  space-net:
    driver: bridge

volumes:
  postgres_data:
