services:

  postgres:
    image: postgres:15-alpine
    container_name: space-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: space_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - space-net

  server:
    build: ./space-service
    container_name: space-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - GRPC_TELEMETRY_HOST=telemetry
      - GRPC_TELEMETRY_PORT=9091
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/space_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - postgres
      - telemetry
    networks:
      - space-net

  scheduler:
    build: ./scheduler-service
    container_name: scheduler-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SERVER_URL=http://server:8080/api
    depends_on:
      - server
    networks:
      - space-net

  telemetry:
    build: ./telemetry-service
    container_name: telemetry-service
    ports:
      - "9091:9091"
    environment:
      - GRPC_SERVER_PORT=9091
    networks:
      - space-net

networks:
  space-net:
    driver: bridge

volumes:
  postgres_data:

